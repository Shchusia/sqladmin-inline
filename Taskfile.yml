# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

dotenv: [ '.env' ]

tasks:
  default:
    cmds:
      - task help
  help:
    desc: Show available tasks and their description
    silent: true
    cmds:
      - 'echo ""'
      - 'echo "Usage: task [task-name] [options]"'
      - 'echo ""'
      - 'echo "Available tasks:"'
      - task --list

  test:
    desc: Run tests
    cmds:
      - pytest tests --cov=sqladmin_inline --cov-branch --cov-report=term-missing -o log_cli=true
    silent: true

  publishtest:
    silent: true
    desc: Run tests and publish results to https://coveralls.io/
    cmds:
      - uv run pytest tests --cov=sqladmin_inline --cov-branch --cov-report=term-missing --cov-report=xml -o log_cli=true
      - coveralls


  lint:
    desc: Check code by linters
    cmds:
      - pre-commit run --all-files

  sync:
    desc: "Sync libraries"
    cmds:
      - uv sync -U --group demo --group tests --group lint --active --inexact

  e2e:
    desc: Headless browser test (node + jsdom), external network blocked
    cmds:
      - cd tests/e2e && npm install --silent
      - pytest tests/test_e2e_browser.py -o log_cli=true

  demo:
    desc: "Run Demo"
    cmds:
      - uv run python demo.py

  build:
    desc: Build library
    cmds:
      - rm -rf dist
      - uv build

  publish:
    desc: Publish the compiled library
    cmds:
      - uv publish

  release:
    desc: "Bump version, build and publish. Usage: task release [type=patch|minor|major] (default: patch)"
    silent: true
    vars:
      BUMP_TYPE: '{{.type | default "patch"}}'
      PYPROJECT: "pyproject.toml"
    cmds:
      - |
        # Validate type
        if [ "{{.BUMP_TYPE}}" != "patch" ] && [ "{{.BUMP_TYPE}}" != "minor" ] && [ "{{.BUMP_TYPE}}" != "major" ]; then
          echo "[ERROR] Invalid type '{{.BUMP_TYPE}}'. Use: patch, minor or major"
          exit 1
        fi

        # Extract current version from pyproject.toml
        CURRENT=$(grep '^version' {{.PYPROJECT}} | head -1 | sed 's/version *= *"\(.*\)"/\1/')
        if [ -z "$CURRENT" ]; then
          echo "[ERROR] Could not find version in {{.PYPROJECT}}"
          exit 1
        fi

        MAJOR=$(echo "$CURRENT" | cut -d. -f1)
        MINOR=$(echo "$CURRENT" | cut -d. -f2)
        PATCH=$(echo "$CURRENT" | cut -d. -f3)

        if [ "{{.BUMP_TYPE}}" = "major" ]; then
          MAJOR=$((MAJOR + 1))
          MINOR=0
          PATCH=0
        elif [ "{{.BUMP_TYPE}}" = "minor" ]; then
          MINOR=$((MINOR + 1))
          PATCH=0
        else
          PATCH=$((PATCH + 1))
        fi

        NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

        echo ">>> Bumping version: ${CURRENT} → ${NEW_VERSION} ({{.BUMP_TYPE}})"

        # Replace version in pyproject.toml (only first occurrence — the package version)
        sed -i "0,/^version = \"${CURRENT}\"/s//version = \"${NEW_VERSION}\"/" {{.PYPROJECT}}

        # Verify
        UPDATED=$(grep '^version' {{.PYPROJECT}} | head -1 | sed 's/version *= *"\(.*\)"/\1/')
        if [ "$UPDATED" != "$NEW_VERSION" ]; then
          echo "[ERROR] Version update failed. Check {{.PYPROJECT}} manually."
          exit 1
        fi

        echo "[OK] Version updated to ${NEW_VERSION}"

      - task: build
      - task: publish
