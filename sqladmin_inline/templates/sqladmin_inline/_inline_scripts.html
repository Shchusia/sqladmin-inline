{#- Modals + bundled scripts. No external URLs: everything is served by the admin app. -#}
<div class="modal modal-blur fade" id="inline-modal" tabindex="-1" role="dialog" aria-hidden="true"
     aria-labelledby="inline-modal-title">
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="inline-modal-title">Add</h5>
        <button type="button" class="btn-close" data-inline-dismiss aria-label="Close"></button>
      </div>
      <div class="modal-body" id="inline-modal-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn me-auto" data-inline-dismiss>Cancel</button>
        <button type="button" class="btn btn-primary" id="inline-modal-save">
          <span class="spinner-border spinner-border-sm d-none me-2" id="inline-modal-spinner"></span>Save
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal modal-blur fade" id="inline-delete-modal" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-sm modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-status bg-danger"></div>
      <div class="modal-body text-center py-4">
        <i class="fa-solid fa-triangle-exclamation text-danger fa-2x mb-3 d-block"></i>
        <h3>Delete items?</h3>
        <div class="text-muted" id="inline-delete-text"></div>
      </div>
      <div class="modal-footer">
        <div class="w-100 d-flex gap-2">
          <button type="button" class="btn w-100" data-inline-dismiss>Cancel</button>
          <button type="button" class="btn btn-danger w-100" id="inline-delete-confirm">
            <span class="spinner-border spinner-border-sm d-none me-2" id="inline-delete-spinner"></span>Delete
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('admin:inline_statics', path='js/Sortable.min.js') }}"></script>
<script src="{{ url_for('admin:inline_statics', path='js/sqladmin-inline.js') }}"></script>
